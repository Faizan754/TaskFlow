<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.40 -1.23 62.45 62.45" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
